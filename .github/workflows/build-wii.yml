name: Build Xash3D Wii (ref-gx)

on:
  push:
    branches:
      - ref-gx
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect libogc WPAD
        run: |
          HEADER="$DEVKITPRO/libogc/include/wiiuse/wpad.h"

          echo "=== WPAD HEADER ==="
          echo "$HEADER"

          echo "=== NUNCHUK Y ESTRUCTURAS ==="
          grep -n -A35 -B10 -E 'struct nunchuk|struct ir_t|typedef struct.*WPADData|WPADData' "$HEADER"

          echo "=== FUNCIONES DE LECTURA ==="
          grep -n -E 'WPAD_Data|WPAD_IR|WPAD_ScanPads|WPAD_SetDataFormat|WPAD_SetVRes' "$HEADER"

      - name: Clone hlsdk-portable with submodules
        run: |
          git clone --recursive https://github.com/Gerardo-Hub17/hlsdk-portable.git "$GITHUB_WORKSPACE/../hlsdk-portable"

      - name: Clone mainui_cpp with submodules
        run: |
          git clone --recursive https://github.com/Gerardo-Hub17/mainui_cpp.git "$GITHUB_WORKSPACE/../mainui_cpp"

      - name: Verify cloned directories
        run: |
          echo "=== hlsdk-portable check ==="
          ls "$GITHUB_WORKSPACE/../hlsdk-portable/cl_dll/ev_hldm.cpp" 2>&1 || echo "MISSING ev_hldm.cpp"
          echo "=== mainui_cpp check ==="
          ls "$GITHUB_WORKSPACE/../mainui_cpp/link_helper.cpp" 2>&1 || echo "MISSING link_helper.cpp"
          echo "=== miniutl check (dependencies de mainui_cpp) ==="
          ls "$GITHUB_WORKSPACE/../mainui_cpp/miniutl/" 2>&1 | head -5 || echo "MISSING miniutl"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake git build-essential

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Wii.cmake \
            -DXASH_RENDERER=ref_gx \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Find generated files
        run: |
          echo "=== Generated ELF/DOL files ==="
          find build -type f \( -name "*.dol" -o -name "*.elf" \) -print

      - name: Resolve Wii crash addresses
        run: |
          echo "=== DEVKITPRO ==="
          echo "$DEVKITPRO"
          echo "=== DEVKITPPC ==="
          echo "$DEVKITPPC"

          echo "=== Searching addr2line ==="
          find "$DEVKITPRO" -type f -name "powerpc-eabi-addr2line" -print

          ADDR2LINE=$(find "$DEVKITPRO" -type f -name "powerpc-eabi-addr2line" -print -quit)

          if [ -z "$ADDR2LINE" ]; then
            echo "ERROR: powerpc-eabi-addr2line not found"
            echo "=== PowerPC tools found ==="
            find "$DEVKITPRO" -type f -name "powerpc-eabi-*" -print | head -50
            exit 1
          fi

          echo "Using: $ADDR2LINE"
          "$ADDR2LINE" --version || true

          echo "=== Resolving crash addresses ==="
          for elf in $(find build -type f -name "*.elf"); do
            echo "========================================"
            echo "ELF: $elf"
            echo "========================================"

            "$ADDR2LINE" -f -C -e "$elf" \
              0x803B7EA8 \
              0x803B0F7C \
              0x80392968 \
              0x802FD32C \
              0x800D1998 \
              0x8008D3C0 \
              0x8008C754 \
              0x800041BC
          done

      - name: Upload Wii build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xash-wii-ref-gx-debug
          path: |
            build/**/*.dol
            build/**/*.elf
          if-no-files-found: warn
          retention-days: 30
